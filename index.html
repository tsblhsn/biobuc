<style>

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

body{background:var(--bg);color:var(--mist);font:400 15px/1.45 "Manrope",system-ui,sans-serif;overscroll-behavior-y:contain;touch-action:manipulation}

.v{padding:0 16px}

.bar{display:flex;align-items:center;gap:8px;height:calc(50px + var(--top));padding-top:var(--top);color:var(--fg);font-weight:700;font-size:17px;position:sticky;top:0;background:var(--bg);z-index:5}

.lk.on{color:var(--sun)}.lk.on svg,.bm.on svg{fill:currentColor}.bm.on{color:var(--teal)}

.s1{flex:none;width:60px;text-align:center;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s1 svg{display:block;margin:0 auto 2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -16px}
.th{aspect-ratio:1;background:var(--s1);overflow:hidden;cursor:pointer}

.row{display:flex;align-items:center;gap:12px;min-height:54px;cursor:pointer;color:var(--fg)}

#cin{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;display:flex;gap:8px;padding:8px 16px calc(8px + var(--bot));background:var(--bg);border-top:1px solid var(--line)}

#lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lightbox img{max-width:100%;max-height:85vh;object-fit:contain}
#lightbox .lb-close{position:absolute;top:calc(20px + var(--top));right:20px;background:none;border:0;color:#fff;font-size:32px;cursor:pointer}

.menu-wrap{position:relative;margin-left:auto}

/* Perfect Avatar Cropper Logic */
var cropImgObj=null, cropScale=1, cropX=0, cropY=0, startX=0, startY=0, isDragging=false;
function initCropper(file){
  var url=URL.createObjectURL(file);
  cropImgObj=new Image();
  cropImgObj.onload=function(){
    var imgEl=$("crop-img");
    imgEl.src=url;
    imgEl.style.width=cropImgObj.naturalWidth+"px";
    imgEl.style.height=cropImgObj.naturalHeight+"px";
    
    var minDim=Math.min(cropImgObj.naturalWidth, cropImgObj.naturalHeight);
    cropScale=220/minDim;
    cropX=(220 - cropImgObj.naturalWidth*cropScale)/2;
    cropY=(220 - cropImgObj.naturalHeight*cropScale)/2;
    updateCropTransform();
    $("cropper-modal").hidden=false;
  };
  cropImgObj.src=url;
}
function updateCropTransform(){
  var img=$("crop-img");
  img.style.transform="translate("+cropX+"px, "+cropY+"px) scale("+cropScale+")";
}
var wrapEl=$("crop-wrap");
wrapEl.onpointerdown=function(e){isDragging=true;startX=e.clientX-cropX;startY=e.clientY-cropY;wrapEl.setPointerCapture(e.pointerId)};
wrapEl.onpointermove=function(e){if(!isDragging)return;cropX=e.clientX-startX;cropY=e.clientY-startY;updateCropTransform()};
wrapEl.onpointerup=function(e){isDragging=false;try{wrapEl.releasePointerCapture(e.pointerId)}catch(err){}};

$("crop-cancel").onclick=function(){$("cropper-modal").hidden=true};
$("crop-save").onclick=async function(){
  $("cropper-modal").hidden=true;
  say("e-m","Processing avatar...",1);
  var canvas=document.createElement("canvas");canvas.width=300;canvas.height=300;
  var ctx=canvas.getContext("2d");
  ctx.fillStyle="#000";ctx.fillRect(0,0,300,300);
  ctx.save();
  var ratio=300/220;
  ctx.translate(cropX*ratio, cropY*ratio);
  ctx.scale(cropScale, cropScale);
  ctx.drawImage(cropImgObj,0,0);
  ctx.restore();
  
  canvas.toBlob(async function(blob){
    try{
      var path=await upPhoto(blob,"avatar-");
      var r=await sb.from("profiles").update({avatar_url:path}).eq("id",me.id);
      if(r.error)throw r.error;
      pr.avatar_url=path;FD=0;say("e-m","Profile picture updated!",1);
      setTimeout(function(){openSub("edit")},500);
    }catch(err){say("e-m",err.message||"Failed to update avatar")}
  },"image/jpeg",0.92);
};

  $("setl").innerHTML=SET.map(function(g){return '<div class="grp">'+g[0]+'</div>'+g[1].map(function(r){return '<div class="row" data-act="sub" data-k="'+r[0]+'">'+ic(r[2],22)+'<div class="n">'+r[1]+'</div><span class="c">'+ic("chev",18)+'</span></div>'}).join("")}).join("")+
  '<div class="grp"></div><div class="row" data-act="out" style="color:var(--red)">'+ic("out",22)+'<div class="n">Log out</div></div>';

function rowsH(d,kind){

async function openSub(k){

  $("subt").textContent=t;$("subb").innerHTML="";go("sub");var h="";
  if(k=="edit")h='<div style="display:flex;align-items:center;gap:14px">'+avH(pr,64)+'<div style="flex:1"><div class="sm">Profile picture</div><label class="gallery-btn-label" style="padding:8px 12px;margin-top:4px">From Gallery <input id="e-av" type="file" accept="image/*" hidden></label></div></div><input id="e-dn" placeholder="Name" value="'+esc(pr.display_name||"")+'"><input id="e-un" placeholder="Username" autocapitalize="none" value="'+esc(pr.username||"")+'"><textarea id="e-bio" rows="3" placeholder="Bio">'+esc(pr.bio||"")+'</textarea><button data-act="sp">Save</button><div class="msg" id="e-m"></div>';
  else if(k=="acct")h='<div class="grp" style="margin-top:0">Email</div><div class="sm">'+esc(me.email||"")+'</div><input id="e-em" type="email" placeholder="New email"><button data-act="sem">Change email</button><div class="msg" id="em-m"></div><div class="grp">Password</div><input id="e-pw" type="password" placeholder="New password (at least 8 characters)" autocomplete="new-password"><button data-act="spw">Change password</button><div class="msg" id="pw-m"></div><div class="grp">Phone number</div><div class="sm">Adding a phone number needs an SMS service, which is not set up yet.</div>';
  else if(k=="saved"){var s=await sb.from("saves").select("post_id,posts(caption,media_path,profiles(username,is_admin))").eq("user_id",me.id);h=rowsH(s.data,"unsave")||'<p class="sm">Nothing saved yet. Tap the bookmark under a photo.</p>'}
  else if(k=="act"){var l=await sb.from("likes").select("post_id,posts(caption,media_path,profiles(username,is_admin))").eq("user_id",me.id);h='<div class="sm">Photos you liked</div>'+(rowsH(l.data,"unlike")||'<p class="sm">You have not liked anything yet.</p>')}
  else if(k=="arch"){
    var a=await sb.from("stories").select("id,media_path,music,created_at").eq("user_id",me.id).lt("expires_at",new Date().toISOString()).order("created_at",{ascending:false});
    ARC=a.data||[];h=ARC.length?'<div class="sm">Stories move here 24 hours after posting. Only you can see them.</div><div class="grid3">'+ARC.map(function(s,i){return '<div class="th" data-act="arc" data-k="'+i+'">'+thumb(s)+'</div>'}).join("")+'</div>':'<p class="sm">No archived stories yet. Stories move here 24 hours after posting.</p>';
  }
  else if(k=="blk"){
    var ids=Object.keys(BL),by={};
    if(ids.length){var u=await sb.from("profiles").select("id,username,display_name,avatar_url,is_admin").in("id",ids);(u.data||[]).forEach(function(x){by[x.id]=x})}
    h=ids.length?ids.map(function(id){var x=by[id]||{};return '<div class="row" style="cursor:default">'+avH(x,40)+'<div class="n">@'+esc(x.username)+badge(x.id)+'<small>'+esc(x.display_name||"")+'</small></div><button class="g s" data-act="unblock" data-id="'+id+'">Unblock</button></div>'}).join(""):'<p class="sm">You have not blocked anyone.</p>';
  }
  $("subb").innerHTML=h;
}

/* E2EE messages */
var EC={name:"ECDH",namedCurve:"P-256"};
async function keys(){
  var k=localStorage.getItem("bb_key_"+me.id);
  if(k){var j=JSON.parse(k);KP={priv:await crypto.subtle.importKey("jwk",j.priv,EC,false,["deriveKey"]),pub:j.pub}}
  else{
    var p=await crypto.subtle.generateKey(EC,true,["deriveKey"]);
    var pj=await crypto.subtle.exportKey("jwk",p.privateKey),qj=JSON.stringify(await crypto.subtle.exportKey("jwk",p.publicKey));
    localStorage.setItem("bb_key_"+me.id,JSON.stringify({priv:pj,pub:qj}));KP={priv:p.privateKey,pub:qj};
  }
  if(pr.public_key!==KP.pub){await sb.from("profiles").update({public_key:KP.pub}).eq("id",me.id);pr.public_key=KP.pub}
}
function b64(a){return btoa(String.fromCharCode.apply(null,new Uint8Array(a)))}
function ub(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function skey(){
  if(SK[C.id])return SK[C.id];
  var pk=await crypto.subtle.importKey("jwk",JSON.parse(C.pub),EC,false,[]);
  return SK[C.id]=await crypto.subtle.deriveKey({name:"ECDH",public:pk},KP.priv,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function msgs(){
  var r=await sb.from("messages").select("sender,receiver").order("created_at",{ascending:false}).limit(300);
  var ps=[];(r.data||[]).forEach(function(m){var p=m.sender==me.id?m.receiver:m.sender;if(ps.indexOf(p)<0&&!BL[p])ps.push(p)});
  if(!ps.length){$("clist").innerHTML='<p style="text-align:center;margin-top:30px">No conversations yet. Open someone\u2019s profile and tap Message.</p>';return}
  var u=await sb.from("profiles").select("id,username,display_name,avatar_url,is_admin").in("id",ps),by={};(u.data||[]).forEach(function(x){by[x.id]=x});
  $("clist").innerHTML=ps.map(function(id){var x=by[id]||{};return '<div class="row" data-act="chat" data-id="'+id+'">'+avH(x,46)+'<div class="n">'+esc(x.display_name||x.username)+badge(x.id)+'<small>@'+esc(x.username)+'</small></div></div>'}).join("");
}
async function openConv(id){
  var p=await sb.from("profiles").select("id,username,display_name,public_key,is_admin").eq("id",id).single();
  if(!p.data)return;
  C={id:id,name:p.data.display_name||p.data.username,pub:p.data.public_key};
  $("cn").textContent=C.name;$("cm").innerHTML="";go("conv");
  $("ci").disabled=!C.pub;$("ci").placeholder=C.pub?"Message":"This person has not opened the new BioBuc yet";
}
async function loadConv(){
  if(!C.id||$("conv").hidden)return;
  var r=await sb.from("messages").select("id,sender,ciphertext").or("and(sender.eq."+me.id+",receiver.eq."+C.id+"),and(sender.eq."+C.id+",receiver.eq."+me.id+")").order("created_at");
  var d=r.data||[];if(d.length==LC)return;LC=d.length;
  var out="";
  if(C.pub){var k=await skey();for(var i=0;i<d.length;i++){var t;try{var p=d[i].ciphertext.split(".");t=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(p[0])},k,ub(p[1])))}catch(e){t="Cannot decrypt on this device"}out+='<div class="b'+(d[i].sender==me.id?" me":"")+'">'+esc(t)+'</div>'}}
  $("cm").innerHTML=out;scrollTo(0,document.body.scrollHeight);
}
async function sendMsg(){
  var t=$("ci").value.trim();if(!t||!C.pub)return;
  var k=await skey(),iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(t));
  var r=await sb.from("messages").insert({sender:me.id,receiver:C.id,ciphertext:b64(iv)+"."+b64(c)});
  if(r.error){toast("Cannot send. You may be blocked.");return}
  $("ci").value="";loadConv();
}
$("cs").onclick=sendMsg;$("ci").onkeydown=function(e){if(e.key=="Enter")sendMsg()};

/* hashtags */
async function tagSearch(t){
  t=t.replace(/[^A-Za-z0-9_\u0980-\u09FF]/g,"");if(!t){$("res").innerHTML="";return}
  var r=await sb.from("posts").select("id,media_path,caption").ilike("caption","%#"+t+"%").order("created_at",{ascending:false}).limit(60);
  var re=new RegExp("#"+t+"(?![A-Za-z0-9_\\u0980-\\u09FF])","i");
  var d=(r.data||[]).filter(function(x){return x.media_path&&!ISV.test(x.media_path)&&re.test(x.caption||"")});
  $("res").innerHTML='<div class="sm" style="margin:6px 0">#'+esc(t)+' \u00b7 '+d.length+' photos</div><div class="grid3">'+d.map(function(x){return '<div class="th" data-act="open" data-id="'+x.id+'">'+thumb(x)+'</div>'}).join("")+'</div>';
}

/* followers list */
function followBtn(id){
  var f=!!FW[id];
  if(ADM[id]&&f)return '<button class="g s" disabled style="opacity:.6">Following</button>';
  return '<button class="'+(f?"g ":"")+'s" data-act="flw" data-id="'+id+'">'+(f?"Following":"Follow")+'</button>';
}
async function openList(kind,id){
  $("lv").hidden=false;$("lvt").textContent=kind=="followers"?"Followers":"Following";$("lvb").innerHTML="";
  var a=kind=="followers"?["follower","following"]:["following","follower"];
  var r=await sb.from("follows").select(a[0]).eq(a[1],id).limit(200);
  var ids=(r.data||[]).map(function(x){return x[a[0]]});
  if(!ids.length){$("lvb").innerHTML='<p class="sm" style="padding:20px 0">Nobody here yet.</p>';return}
  var u=await sb.from("profiles").select("id,username,display_name,avatar_url,is_admin").in("id",ids);
  $("lvb").innerHTML=(u.data||[]).filter(function(x){return !BL[x.id]}).map(function(x){return '<div class="row" data-act="prof" data-id="'+x.id+'">'+avH(x,44)+'<div class="n">@'+esc(x.username)+badge(x.id)+'<small>'+esc(x.display_name||"")+'</small></div>'+(x.id==me.id?"":followBtn(x.id))+'</div>'}).join("");
}

/* notifications */
async function notifData(){
  var q=await Promise.all([
    sb.from("likes").select("post_id,user_id,created_at,posts!inner(user_id),profiles(username,avatar_url,is_admin)").eq("posts.user_id",me.id).neq("user_id",me.id).order("created_at",{ascending:false}).limit(30),
    sb.from("comments").select("post_id,user_id,body,created_at,posts!inner(user_id),profiles(username,avatar_url,is_admin)").eq("posts.user_id",me.id).neq("user_id",me.id).order("created_at",{ascending:false}).limit(30),
    sb.from("follows").select("follower,created_at").eq("following",me.id).order("created_at",{ascending:false}).limit(30)]);
  var fl=q[2].data||[],ids=fl.map(function(x){return x.follower}),by={};
  if(ids.length){var u=await sb.from("profiles").select("id,username,avatar_url,is_admin").in("id",ids);(u.data||[]).forEach(function(x){by[x.id]=x})}
  var it=[];
  (q[0].data||[]).forEach(function(l){it.push({t:l.created_at,k:"like",id:l.post_id,u:l.user_id,p:l.profiles})});
  (q[1].data||[]).forEach(function(c){it.push({t:c.created_at,k:"comment",id:c.post_id,u:c.user_id,p:c.profiles,b:c.body})});
  fl.forEach(function(f){it.push({t:f.created_at,k:"follow",id:f.follower,u:f.follower,p:by[f.follower]})});
  return it.filter(function(i){return !BL[i.u]}).sort(function(a,b){return new Date(b.t)-new Date(a.t)}).slice(0,40);
}
async function notifDot(){try{var it=await notifData();$("ndot").hidden=!(it.length&&new Date(it[0].t)>NS)}catch(e){}}
async function notifs(){
  var it=await notifData();
  $("nlist").innerHTML=it.map(function(i){
    var txt=i.k=="like"?" liked your photo":i.k=="comment"?" commented: "+esc((i.b||"").slice(0,60)):" started following you";
    return '<div class="row" data-act="'+(i.k=="follow"?"prof":"open")+'" data-id="'+i.id+'">'+avH(i.p,44)+'<div class="n" style="font-weight:500"><b>@'+esc(i.p&&i.p.username)+badge(i.u)+'</b>'+txt+'<small>'+ago(i.t)+'</small></div></div>';
  }).join("")||'<p style="text-align:center;margin-top:30px">No activity yet.</p>';
  NS=Date.now();localStorage.setItem("bb_ns",String(NS));$("ndot").hidden=true;
}
setInterval(function(){if(me)notifDot()},120000);

var PCAP="";

/* global click handler */
document.addEventListener("click",async function(e){
  if(e.target.id=="e-av"){
    e.target.onchange=function(ev){if(ev.target.files[0])initCropper(ev.target.files[0])};
    return;
  }
  
  if(!e.target.closest(".menu-wrap")){
    document.querySelectorAll(".menu-dropdown").forEach(function(m){m.hidden=true});
  }

  var t=e.target.closest("[data-go],[data-act]");
  if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  var a=t.dataset.act,d=t.dataset;
  
  if(a=="toggle-menu"){
    e.stopPropagation();
    document.querySelectorAll(".menu-dropdown").forEach(function(m){if(m.id!=="menu-"+d.id)m.hidden=true});
    var menu=$("menu-"+d.id);
    if(menu)menu.hidden=!menu.hidden;
  }
  else if(a=="zoom"){openLightbox(d.url)}
  else if(a=="new")openSheet("post");
  else if(a=="addstory")openSheet("story");
  else if(a=="story"&&G[d.u])openV(G[d.u],0);
  else if(a=="arc")openV(ARC,+d.k);
  else if(a=="sub")openSub(d.k);
  else if(a=="out")sb.auth.signOut();
  else if(a=="chat"){if(!$("pv").hidden)closePost();openConv(d.id)}
  else if(a=="myprof"){PU=me.id;go("prof")}
  else if(a=="prof"){if(!$("pv").hidden)closePost();$("lv").hidden=true;openProfile(d.id)}
  else if(a=="back")go(PV&&PV!="prof"?PV:"home");
  else if(a=="open")openPost(+d.id);
  else if(a=="pvx")closePost();
  else if(a=="tag"){if(!$("pv").hidden)closePost();$("q").value="#"+d.t;go("search");tagSearch(d.t)}
  else if(a=="list")openList(d.k,d.id);
  else if(a=="lvx")$("lv").hidden=true;
  else if(a=="flw"){
    if(FW[d.id]&&ADM[d.id]){toast("You always follow the admin");return}
    if(FW[d.id]){delete FW[d.id];await sb.from("follows").delete().eq("follower",me.id).eq("following",d.id)}else{FW[d.id]=1;await sb.from("follows").insert({follower:me.id,following:d.id})}
    var on2=!!FW[d.id];t.className=(on2?"g ":"")+"s";t.textContent=on2?"Following":"Follow";
  }
  else if(a=="ed-post"){
    PID=d.id; $("ecap").value=d.cap||""; say("em2",""); $("esh").hidden=false;
  }
  else if(a=="esx")$("esh").hidden=true;
  else if(a=="esv"){
    var nv=$("ecap").value.trim(),er=await sb.from("posts").update({caption:nv,edited_at:new Date().toISOString()}).eq("id",PID).eq("user_id",me.id);
    if(er.error){say("em2",er.error.message);return}
    $("esh").hidden=true;FD=0;toast("Caption updated");if(!$("pv").hidden)openPost(PID);else feed();
  }
  else if(a=="more"){var c=t.previousElementSibling;c.classList.remove("cl");t.remove()}
  else if(a=="share")shareProf(d.u);
  else if(a=="like"){
    var on=d.m=="1",n=t.querySelector("span");d.m=on?"0":"1";t.classList.toggle("on",!on);n.textContent=Math.max(0,+n.textContent+(on?-1:1));
    if(!on){t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop")}
    FD=0;
    if(on)await sb.from("likes").delete().eq("post_id",d.id).eq("user_id",me.id);else await sb.from("likes").insert({post_id:+d.id,user_id:me.id});
  }
  else if(a=="save"){
    var sv=!!SVD[d.id];t.classList.toggle("on",!sv);
    if(sv){delete SVD[d.id];await sb.from("saves").delete().eq("post_id",d.id).eq("user_id",me.id)}else{SVD[d.id]=1;await sb.from("saves").insert({post_id:+d.id,user_id:me.id});toast("Saved")}
  }
  else if(a=="unsave"){e.stopPropagation();delete SVD[d.id];await sb.from("saves").delete().eq("post_id",d.id).eq("user_id",me.id);openSub("saved")}
  else if(a=="unlike"){e.stopPropagation();await sb.from("likes").delete().eq("post_id",d.id).eq("user_id",me.id);FD=0;openSub("act")}
  else if(a=="del"){
    if(!confirm("Delete this photo?"))return;
    await sb.from("posts").delete().eq("id",d.id);if(d.p)await sb.storage.from("media").remove([d.p]);
    closePost();FD=0;toast("Deleted");if(CUR=="prof")profile();else feed();
  }
  else if(a=="dc"){await sb.from("comments").delete().eq("id",d.id);FD=0;loadComments()}
  else if(a=="follow"){
    if(FW[d.id]&&ADM[d.id]){toast("You always follow the admin");return}
    if(FW[d.id]){delete FW[d.id];await sb.from("follows").delete().eq("follower",me.id).eq("following",d.id)}
    else{FW[d.id]=1;await sb.from("follows").insert({follower:me.id,following:d.id})}
    profile();
  }
  else if(a=="block"){
    if(!confirm("Block this account?"))return;
    var b=await sb.from("blocks").insert({blocker:me.id,blocked:d.id});if(b.error){toast(b.error.message);return}
    BL[d.id]=1;delete FW[d.id];await sb.from("follows").delete().eq("follower",me.id).eq("following",d.id);FD=0;toast("Blocked");go("home",1);
  }
  else if(a=="unblock"){await sb.from("blocks").delete().eq("blocker",me.id).eq("blocked",d.id);delete BL[d.id];FD=0;openSub("blk")}
  else if(a=="sp"){
    var u=$("e-un").value.trim().toLowerCase();
    if(!UN.test(u)){say("e-m","Username must be 3-20 characters");return}
    var dn=$("e-dn").value.trim(),bio=$("e-bio").value.trim();
    var r=await sb.from("profiles").update({username:u,display_name:dn,bio:bio}).eq("id",me.id);
    if(r.error){say("e-m",r.error.message.indexOf("duplicate")>=0?"Username taken":r.error.message);return}
    pr.username=u;pr.display_name=dn;pr.bio=bio;FD=0;say("e-m","Profile saved",1);
  }
  else if(a=="sem"){
    var em=$("e-em").value.trim();if(!em){say("em-m","Enter a new email");return}
    var r2=await sb.auth.updateUser({email:em});say("em-m",r2.error?r2.error.message:"Check inbox to confirm.",!r2.error);
  }
  else if(a=="spw"){
    var p=$("e-pw").value;if(p.length<8){say("pw-m","Minimum 8 characters");return}
    var r3=await sb.auth.updateUser({password:p});
    if(r3.error){say("pw-m",r3.error.message);return}
    $("e-pw").value="";say("pw-m","Password changed",1);
  }
});
sb.auth.getSession().then(function(r){enter(r.data.session)});
setMode("in");
</script>
